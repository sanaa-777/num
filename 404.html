<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | الدليل اليمني التجاري</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Kufi Arabic', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 50%, #fef2f2 100%);
      color: #1e293b; direction: rtl;
    }
    .container {
      text-align: center; padding: 40px 24px; max-width: 480px; width: 90%;
    }
    .error-code {
      font-size: 120px; font-weight: 700; color: #dc2626;
      line-height: 1; margin-bottom: 8px;
      background: linear-gradient(135deg, #dc2626, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-title {
      font-size: 24px; font-weight: 700; color: #0f172a; margin-bottom: 12px;
    }
    .error-desc {
      font-size: 15px; color: #64748b; line-height: 1.7; margin-bottom: 32px;
    }
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      background: #dc2626; color: #fff; padding: 14px 32px;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      text-decoration: none; transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .btn-home:hover { background: #b91c1c; }
    .btn-home:active { transform: scale(0.97); }
    .btn-home svg { width: 18px; height: 18px; }
    .links { margin-top: 24px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .links a {
      color: #64748b; font-size: 13px; text-decoration: none;
      padding: 8px 16px; border-radius: 8px; border: 1px solid #e2e8f0;
      transition: all 0.15s; font-family: inherit;
    }
    .links a:hover { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
    @media (max-width: 480px) {
      .error-code { font-size: 80px; }
      .error-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">الصفحة غير موجودة</h1>
    <p class="error-desc">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. تأكد من صحة الرابط أو عد إلى الصفحة الرئيسية.</p>
    <a href="/" class="btn-home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      العودة للرئيسية
    </a>
    <div class="links">
      <a href="/#search">البحث</a>
      <a href="/#add">إضافة نشاط</a>
    </div>
  </div>
</body>
</html>
