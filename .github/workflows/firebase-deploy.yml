# Auto-deploy to Firebase Hosting on push to main
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy_default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to deel-39f2e.web.app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEEL_39F2E }}'
          projectId: deel-39f2e
          channelId: live

  deploy_dalil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to dalil-yemen-deel.web.app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEEL_39F2E }}'
          projectId: deel-39f2e
          target: dalil-yemen-deel
          channelId: live
