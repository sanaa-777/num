# Auto-deploy to Firebase Hosting + Firestore + Storage on push to main
name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@11.30.0

      - name: Install dependencies
        run: npm install

      - name: Build production assets
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEEL_39F2E }}'

      - name: Deploy Firestore Rules
        run: firebase deploy --only firestore:rules --project deel-39f2e --force

      - name: Deploy Firestore Indexes
        run: gcloud firestore indexes composite create --project=deel-39f2e --collection-group=places --field-config=isActive:ASC,status:ASC,createdAt:DESC --field-config=isActive:ASC,category:ASC,createdAt:DESC --field-config=isActive:ASC,city:ASC,createdAt:DESC --field-config=isActive:ASC,status:ASC,category:ASC,createdAt:DESC --field-config=isActive:ASC,status:ASC,city:ASC,createdAt:DESC --async 2>/dev/null || echo "Index deploy skipped (may already exist or require manual creation)"
        continue-on-error: true

      - name: Deploy Storage Rules
        run: firebase deploy --only storage --project deel-39f2e --force

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEEL_39F2E }}'
          projectId: deel-39f2e
          target: dalil-yemen-deel
          channelId: live
