  <!-- Analytics -->
  <script>
    // تتبع الزيارات
    const Analytics = {
      init() {
        this.trackVisit();
        this.trackPageView();
        window.addEventListener('hashchange', () => this.trackPageView());
      },
      trackVisit() {
        const visits = JSON.parse(localStorage.getItem('dy_analytics_visits') || '[]');
        const today = new Date().toISOString().split('T')[0];
        const existing = visits.find(v => v.date === today);
        if (existing) {
          existing.count++;
        } else {
          visits.push({ date: today, count: 1 });
        }
        if (visits.length > 90) visits.splice(0, visits.length - 90);
        localStorage.setItem('dy_analytics_visits', JSON.stringify(visits));
      },
      trackPageView() {
        const views = JSON.parse(localStorage.getItem('dy_analytics_views') || '[]');
        views.push({
          page: location.hash || '#home',
          timestamp: new Date().toISOString(),
          userAgent: navigator.userAgent.substring(0, 50)
        });
        if (views.length > 1000) views.splice(0, views.length - 1000);
        localStorage.setItem('dy_analytics_views', JSON.stringify(views));
      },
      getStats() {
        const visits = JSON.parse(localStorage.getItem('dy_analytics_visits') || '[]');
        const views = JSON.parse(localStorage.getItem('dy_analytics_views') || '[]');
        const today = new Date().toISOString().split('T')[0];
        return {
          todayVisits: visits.find(v => v.date === today)?.count || 0,
          totalVisits: visits.reduce((s, v) => s + v.count, 0),
          totalViews: views.length,
          last7days: visits.slice(-7)
        };
      }
    };
    Analytics.init();
  </script>
