  <!-- App Initialization -->
  <script>
    // انتظار تحميل Firebase ثم تهيئة التطبيق
    window.addEventListener('load', async () => {
      // انتظار Firebase
      if (typeof firebase === 'undefined') {
        console.error('Firebase not loaded');
        return;
      }

      try {
        // 1. تهيئة المصادقة
        await Auth.init();

        // 2. تهيئة الأدمن الافتراضي
        await Admin.initDefaultAdmin();

        // 3. زرع البيانات التجريبية (مرة واحدة)
        await Data.seedDefaultPlaces();

        // 4. تهيئة التطبيق
        App.init();

        console.log('App initialized with Firestore backend');
      } catch (e) {
        console.error('App initialization error:', e);
        // محاولة تحميل التطبيق حتى بدون مصادقة
