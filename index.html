<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل اليمن | الدليل الشامل للأعمال والأماكن</title>
  <meta name="description" content="دليل اليمن الشامل - ابحث عن المطاعم والفنادق والعيادات والمتاجر وجميع الخدمات في اليمن">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
            accent: { 400:'#fbbf24',500:'#f59e0b',600:'#d97706' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    * { font-family: 'Noto Kufi Arabic', sans-serif; }
    body { margin: 0; background: #f9fafb; }
    a { text-decoration: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .group:hover .group-hover\:block { display: block !important; }
    .icon-sm { width: 18px; height: 18px; }
    .icon-md { width: 22px; height: 22px; }
    .icon-lg { width: 28px; height: 28px; }
    .icon-xl { width: 36px; height: 36px; }
    .cat-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
    .cat-icon-sm { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
    .active-scale { transition: transform 0.1s; }
    .active-scale:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;">
      <div style="width:40px;height:40px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="color:#94a3b8;font-size:13px;">جاري التحميل...</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script src="app/data.js"></script>
  <script src="app/auth.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
